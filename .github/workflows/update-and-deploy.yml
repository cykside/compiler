name: Update Clan Dashboard

# Letakkan file ini di REPO PUBLIK sebagai .github/workflows/update-and-deploy.yml
# Kode proyek tetap di repo privat; repo publik hanya menjalankan Actions (menit gratis).
#
# Repo privat harus berisi: coc_clan.py, clan_dashboard.py, notify_telegram.py, clan_dashboard_template_adv.html,
# requirements.txt, dan folder assets/ (style.css, app.js, favicon, ikon, manifest).
#
# Secrets yang dibutuhkan di repo PUBLIK (Settings > Secrets and variables > Actions):
#   COC_API_KEY, PRIVATE_REPO_TOKEN, TARGET_REPO_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   PLAYER_TAGS (opsional): tag pemain yang ditampilkan di tab Alat, dipisah koma, spasi, atau baris baru
# Variable (opsional): COC_API_BASE
#
# Notifikasi Telegram (logika di notify_telegram.py, repo privat):
#   - war biasa dan ronde CWL: baru / mulai / hasil + rekap; pengingat 2 jam dan 30 menit (belum menyerang)
#   - CWL: awal musim, hasil tiap ronde, akhir musim dengan peringkat perkiraan
#   - Capital Raid: pengingat serangan belum dipakai dan rekap hasil
#   - event resmi Supercell (mulai / berakhir), perubahan penting klan (masuk/keluar/role/naik TH)
#   - rekor: naik level klan, rentetan menang, rekor bintang; Legend League naik/turun dan musim hampir selesai
#   - anggota tanpa donasi >= 14 hari atau tidak menyerang 3 war (sekali seminggu)
#   - pemain ditandai: hero selesai upgrade, rush saat naik TH; kandidat dari watchlist.json masuk/keluar klan
#   - ringkasan harian atau mingguan, jam tenang (pesan non-urgent tanpa bunyi), tombol ke tab dashboard
#   - data gagal diambil / war log jadi privat, workflow gagal (hanya yang pertama) dan pulih
# Secret opsional: TELEGRAM_CHAT_IDS. Variable opsional: NOTIFY_QUIET_HOURS, NOTIFY_SUMMARY, NOTIFY_SUMMARY_HOUR, DASHBOARD_URL.
#
# JANGAN tambahkan trigger pull_request / pull_request_target / issue_comment di workflow ini:
# repo publik bisa dibuka siapa saja.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # untuk langkah keepalive dan membaca riwayat run

concurrency:
  group: clan-dashboard
  cancel-in-progress: false

env:
  PRIVATE_REPO: cykside/cunyuk-of-war   # repo privat berisi kode proyek

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: project
    env:
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout private project
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: project
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: project/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Log repo publik bisa dibaca siapa saja. Tiap tag dari secret PLAYER_TAGS disamarkan
      # satu per satu (secret berisi banyak tag hanya disamarkan utuh, tidak per tag).
      - name: Mask player tags in logs
        env:
          PLAYER_TAGS: ${{ secrets.PLAYER_TAGS }}
        run: |
          for t in $(echo "$PLAYER_TAGS" | tr ',;' '  '); do
            t="${t#\#}"
            [ -n "$t" ] && { echo "::add-mask::$t"; echo "::add-mask::${t^^}"; }
          done
          exit 0

      - name: Run collector and build dashboard
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
          COC_API_BASE: ${{ vars.COC_API_BASE }}
          PLAYER_TAGS: ${{ secrets.PLAYER_TAGS }}   # opsional: hanya tag ini yang ditampilkan di tab Alat
          # Dikosongkan agar coc_clan.py tidak ikut mengirim alert sendiri; semua notifikasi lewat langkah Telegram di bawah.
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
        run: |
          python coc_clan.py --once --clans "#280PQUC2Q" "#2QPP9VRUQ" "#2RJRRG8YQ" --purge-others --out-json docs/data.json --snapshot clan_snapshot.json
          python clan_dashboard.py --snapshot clan_snapshot.json --out docs

      # Jadwal event dari blog resmi Supercell (tidak ada API kalender resmi). Bila gagal, events.json lama
      # (yang ikut di-commit di langkah berikutnya) tetap dipakai, dan tab Jadwal menandai data usang.
      - name: Update official event calendar
        continue-on-error: true
        run: python update_events.py --out docs/events.json

      - name: Verify generated files
        run: |
          test -f docs/index.html
          test -f docs/assets/style.css
          test -f docs/assets/app.js
          test -f docs/assets/tools.js
          test -f docs/assets/manifest.webmanifest
          python - <<'EOF'
          import json, sys
          d = json.load(open("docs/data.json", encoding="utf-8"))
          clans = d.get("clans") or {}
          if not any((c or {}).get("memberList") for c in clans.values()):
              sys.exit("data.json tidak berisi anggota klan")
          print("OK:", ", ".join((c or {}).get("name", "?") for c in clans.values()))
          EOF

      # ---------- Notifikasi Telegram ----------
      # Logika ada di notify_telegram.py (repo privat, ada tes di tests/test_notify_telegram.py).
      # Status agar tiap kejadian dikirim sekali disimpan di notify_state.json dan ikut di-commit
      # ke repo privat oleh langkah berikutnya. Run pertama dan fitur yang baru ditambahkan hanya
      # mencatat kondisi awal tanpa mengirim pesan.
      - name: Telegram - notifikasi penting
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        env:
          PLAYER_TAGS: ${{ secrets.PLAYER_TAGS }}                 # pemain ditandai (hero, rush)
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}     # opsional: chat per klan, "280PQUC2Q=-100111,2QPP9VRUQ=-100222"
          NOTIFY_QUIET_HOURS: ${{ vars.NOTIFY_QUIET_HOURS }}      # opsional: jam tenang WIB, default 23-6, "off" = mati
          NOTIFY_SUMMARY: ${{ vars.NOTIFY_SUMMARY }}              # opsional: daily (default) | weekly | off
          NOTIFY_SUMMARY_HOUR: ${{ vars.NOTIFY_SUMMARY_HOUR }}    # opsional: jam kirim ringkasan WIB, default 20
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}                # opsional: default https://cykside.github.io/coc-web/
        run: python notify_telegram.py


      # State (snapshot + history + notifikasi) disimpan balik ke repo PRIVAT lewat token checkout.
      - name: Save snapshot and history (private repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in clan_snapshot.json clan_history.jsonl notify_state.json players_cache.json; do
            [ -f "$f" ] && git add "$f"
          done
          if [ -f docs/events.json ]; then git add docs/events.json; fi
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan state."
          else
            git commit -m "chore: update clan state [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then ok=1; break; fi
              echo "Percobaan $i gagal, mengulang..."
              sleep 5
            done
            [ "$ok" = 1 ]
          fi

      # gh-pages dijadikan SATU commit yatim tiap deploy (force-push), jadi riwayat tidak menumpuk.
      # Push diulang sampai 4 kali bila GitHub sedang error (mis. "Internal Server Error").
      - name: Deploy to cykside/coc-web
        if: ${{ env.TARGET_REPO_TOKEN != '' }}
        run: |
          set -e
          URL="https://x-access-token:${TARGET_REPO_TOKEN}@github.com/cykside/coc-web.git"
          rm -rf /tmp/coc-web && mkdir -p /tmp/coc-web

          # Ambil gh-pages terakhir (hanya 1 commit) untuk membandingkan isi.
          if ! git clone --quiet --depth 1 --branch gh-pages "$URL" /tmp/coc-web 2>/dev/null; then
            rm -rf /tmp/coc-web && mkdir -p /tmp/coc-web
            git init -q -b gh-pages /tmp/coc-web
            git -C /tmp/coc-web remote add origin "$URL"
          fi
          cd /tmp/coc-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          # "/." ikut menyalin file tersembunyi (.nojekyll) dan subfolder assets/
          cp -R "$GITHUB_WORKSPACE"/project/docs/. .
          git add --all

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Satu commit yatim, lalu timpa gh-pages: riwayat tidak menumpuk.
          git checkout -q --orphan gh-pages-new
          git commit -q -m "Deploy dashboard from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          ok=0
          for i in 1 2 3 4; do
            if git push --force origin gh-pages-new:gh-pages; then ok=1; break; fi
            echo "Push gagal (percobaan $i), mengulang..."
            sleep $((i * 10))
          done
          [ "$ok" = 1 ]

      # GitHub Pages kadang gagal menerbitkan (HTTP 500 "Failed to create deployment") walau push berhasil.
      # Langkah ini menunggu run "pages build and deployment" untuk commit gh-pages yang baru dan, bila gagal,
      # menjalankan ulang job yang gagal (maks. 3 percobaan per run). Butuh izin Actions (read dan write) pada
      # repo coc-web untuk TARGET_REPO_TOKEN; tanpa izin itu langkah ini hanya mencatat pesan dan lewat.
      - name: Pages watchdog (jalankan ulang bila deploy Pages gagal)
        if: ${{ env.TARGET_REPO_TOKEN != '' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          REPO=cykside/coc-web
          SHA=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" refs/heads/gh-pages | cut -f1)
          [ -n "$SHA" ] || { echo "Tidak bisa membaca gh-pages, dilewati."; exit 0; }
          sleep 40
          for i in 1 2 3 4 5; do
            row=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion // "-") \(.run_attempt)"') \
              || { echo "Tidak bisa membaca run Pages (cek izin Actions token)."; exit 0; }
            if [ -z "$row" ]; then echo "Run Pages belum muncul (cek $i)."; sleep 30; continue; fi
            set -- $row
            echo "Run Pages $1: status=$2 hasil=$3 percobaan=$4"
            if [ "$2" = "completed" ] && [ "$3" = "success" ]; then echo "Pages terbit."; exit 0; fi
            if [ "$2" = "completed" ]; then
              if [ "$4" -ge 3 ]; then echo "Sudah 3 percobaan, berhenti."; exit 0; fi
              gh api -X POST "repos/${REPO}/actions/runs/$1/rerun-failed-jobs" >/dev/null && echo "Dijalankan ulang."
            fi
            sleep 30
          done
          echo "Batas waktu pemeriksaan habis; run berikutnya akan menerbitkan ulang."

      # ---------- Notifikasi gagal / pulih ----------
      - name: Telegram - failed (hanya kegagalan pertama)
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/update-and-deploy.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].conclusion')
          if [ "$prev" = "failure" ]; then
            echo "Sudah diberi tahu pada kegagalan sebelumnya."
            exit 0
          fi
          printf '%s\n' \
            "❌ Workflow dashboard klan GAGAL" \
            "Kemungkinan: API key/IP ditolak, tag klan salah, folder assets/ belum ada di repo privat, atau token repo kedaluwarsa." \
            "Pesan berikutnya ditahan sampai berhasil lagi." \
            "${RUN_URL}" > /tmp/tg_msg.txt
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/tg_msg.txt" \
            -d "disable_web_page_preview=true" >/dev/null

      - name: Telegram - pulih
        if: ${{ success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/update-and-deploy.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].conclusion')
          if [ "$prev" = "failure" ]; then
            curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=✅ Dashboard klan berjalan normal lagi" \
              -d "disable_notification=true" >/dev/null
          fi

      # Repo publik tanpa aktivitas ~60 hari: GitHub menonaktifkan jadwalnya. Karena commit state
      # masuk ke repo PRIVAT, repo publik ini tidak punya aktivitas sendiri. Langkah ini mengaktifkan
      # ulang workflow lewat API supaya jadwal tetap hidup.
      - name: Keep schedule alive
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # Memakai API langsung. `gh workflow enable` menolak workflow yang sudah aktif
        # ("could not find any workflows named ...").
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-and-deploy.yml/enable"
