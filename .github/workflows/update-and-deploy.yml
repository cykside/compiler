name: Update Clan Dashboard

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_REPO: cykside/cunyuk-of-war
  TARGET_REPO: cykside/coc-web
  TARGET_BRANCH: gh-pages   # <-- sesuaikan: gh-pages atau main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout private project
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: project
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: project

      - name: Build dashboard
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
          COC_API_BASE: ${{ vars.COC_API_BASE }}
        run: |
          python coc_clan.py --once --clans "#2JVQVYUYC" --out-json docs/data.json --snapshot clan_snapshot.json
          python clan_dashboard.py --snapshot clan_snapshot.json --out docs
        working-directory: project

      - name: Verify build
        run: |
          test -f docs/index.html
          test -f docs/data.json
          python - <<'PY'
          import json
          d = json.load(open("docs/data.json", encoding="utf-8"))
          print("clans:", list((d.get("clans") or {}).keys()))
          PY
        working-directory: project

      - name: Deploy to public Pages repo
        if: ${{ secrets.TARGET_REPO_TOKEN != '' }}
        env:
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          set -euxo pipefail

          rm -rf /tmp/coc-web
          git clone "https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${{ env.TARGET_REPO }}.git" /tmp/coc-web

          cd /tmp/coc-web

          if git ls-remote --exit-code --heads origin "${{ env.TARGET_BRANCH }}" >/dev/null 2>&1; then
            git checkout "${{ env.TARGET_BRANCH }}"
          else
            git checkout --orphan "${{ env.TARGET_BRANCH }}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # copy isi folder docs ke root repo target
          cp -R "${{ github.workspace }}/project/docs/." .

          ls -la
          test -f index.html
          test -f data.json

          git add -A
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Deploy dashboard from ${{ github.repository }}@${{ github.sha }}"
            git push origin "${{ env.TARGET_BRANCH }}"
          fi
